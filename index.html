<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryuze — AM Premium</title>
</head>
<body style="margin:0;background:#0a0a12;color:#ccc;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh">
<div id="s">Loading…</div>
<script>
(async()=>{
  try{
    const r=await fetch('Ryuze-AM-Premium-DualUI.html');
    if(!r.ok) throw new Error(r.status);
    const html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('s').textContent='Error: '+e+' — open Ryuze-AM-Premium-DualUI.html';
  }
})();
</script>
</body>
</html>
