<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryuze — AM Premium</title>
<style>body{margin:0;background:#0a0a12;color:#e0e0ff;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;}</style>
</head>
<body>
<div id="s">Loading…</div>
<script>
(async()=>{
  try{
    const n=5;
    let b64='';
    for(let i=0;i<n;i++){
      document.getElementById('s').textContent='Loading '+(i+1)+'/'+n+'…';
      b64+=await fetch('p'+i+'.txt').then(r=>{if(!r.ok)throw new Error('p'+i+' '+r.status);return r.text()});
    }
    const u8=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('s').textContent='Error: '+e;
    console.error(e);
  }
})();
</script>
</body>
</html>
